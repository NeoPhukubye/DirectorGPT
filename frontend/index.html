<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectorGPT - AI Film Production Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DirectorGPT</h1>
            <p class="tagline">AI-powered multi-agent film production studio</p>
        </header>

        <main>
            <section class="config-section">
                <h2>Configuration</h2>
                <div class="form-group">
                    <label for="apiKey">Gemini API Key</label>
                    <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <select id="model">
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    </select>
                </div>
            </section>

            <section class="generate-section">
                <h2>Generate Film</h2>
                <div class="form-group">
                    <label for="prompt">Film Prompt</label>
                    <textarea id="prompt" rows="3" placeholder="A detective receives a mysterious phone call that changes everything"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" value="Untitled">
                    </div>
                    <div class="form-group">
                        <label for="genre">Genre</label>
                        <select id="genre">
                            <option value="drama">Drama</option>
                            <option value="horror">Horror</option>
                            <option value="comedy">Comedy</option>
                            <option value="sci-fi">Sci-Fi</option>
                            <option value="romance">Romance</option>
                            <option value="thriller">Thriller</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="duration">Duration (s)</label>
                        <input type="number" id="duration" value="60" min="10" max="300">
                    </div>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="enableImages"> Enable Image Generation
                    </label>
                    <label>
                        <input type="checkbox" id="enableVideo"> Enable Video Generation
                    </label>
                    <label>
                        <input type="checkbox" id="enableAudio"> Enable Audio Generation
                    </label>
                </div>
                <button id="generateBtn" class="primary-btn">Generate Film</button>
                <button id="scriptBtn" class="secondary-btn">Generate Script Only</button>
            </section>

            <section id="status" class="status-section hidden">
                <div class="spinner"></div>
                <p id="statusText">Initializing agents...</p>
            </section>

            <section id="results" class="results-section hidden">
                <h2>Production Report</h2>
                <div id="reportStats" class="stats-grid"></div>

                <h3>Script</h3>
                <div id="scriptOutput" class="script-output"></div>

                <button id="downloadBtn" class="secondary-btn">Download Script JSON</button>
            </section>
        </main>

        <footer>
            <p>DirectorGPT - Built for hackathon with Gemini API</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
