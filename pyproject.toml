[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "directorgpt"
version = "0.1.0"
description = "DirectorGPT - AI-powered multi-agent film production studio"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "DirectorGPT Contributors"},
]
keywords = ["ai", "film", "multi-agent", "production", "creative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "google-generativeai>=0.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]
image = [
    "openai>=1.0",
]
audio = [
    "openai>=1.0",
    "elevenlabs>=0.1.0",
]
video = [
    "runwayml",
]

[project.scripts]
directorgpt = "director_gpt.main:main"

[project.urls]
Homepage = "https://github.com/NeoPhukubye/DirectorGPT"
Documentation = "https://github.com/NeoPhukubye/DirectorGPT"
Repository = "https://github.com/NeoPhukubye/DirectorGPT"
Issues = "https://github.com/NeoPhukubye/DirectorGPT/issues"

[tool.setuptools.packages.find]
include = ["director_gpt*"]
exclude = ["tests*", "api*", "frontend*", "examples*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["director_gpt"]
omit = ["*/tests/*", "*/__pycache__/*"]